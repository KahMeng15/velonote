services:
  db:
    image: postgres:15-alpine
    container_name: velonote_db
    environment:
      POSTGRES_USER: ${DB_USER:-velonote}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-velonote}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - velonote-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-backup:
    image: postgres:15-alpine
    container_name: velonote_db_backup
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          export PGPASSWORD="$$DB_PASSWORD"
          RETENTION=$$(psql -Atc "SELECT backup_retention_days FROM system_settings LIMIT 1" 2>/dev/null || echo 7)
          RETENTION=$${RETENTION:-7}
          TS=$$(date +%Y%m%d_%H%M%S)
          pg_dump > "/backups/backup_$$TS.sql" 2>/dev/null
          find /backups -name "backup_*.sql" -mtime "+$$RETENTION" -delete 2>/dev/null
          sleep 86400
        done
    env_file:
      - .env
      - secrets.env
    environment:
      - PGHOST=db
      - PGUSER=${DB_USER:-velonote}
      - PGDATABASE=${DB_NAME:-velonote}
    volumes:
      - ./backups/postgres:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - velonote-net

  redis:
    image: redis:alpine
    container_name: velonote_redis
    command: redis-server --appendonly yes
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - velonote-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/kahmeng15/velonote:latest
    container_name: velonote_api
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "${API_PORT:-8000}"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - secrets.env
    environment:
      # Override DB_HOST to point at the db container (not localhost)
      - DB_HOST=db
      # Override Redis URL to point at the redis container
      - REDIS_URL=redis://redis:6379/0
      - USER_ID=${PUID:-568}
      - GROUP_ID=${PGID:-568}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - velonote-net

  worker:
    image: ghcr.io/kahmeng15/velonote:latest
    container_name: velonote_worker
    command: ["python", "-m", "app.worker_main"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - secrets.env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - USER_ID=${PUID:-568}
      - GROUP_ID=${PGID:-568}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - velonote-net

  nginx:
    image: ghcr.io/kahmeng15/velonote:nginx-latest
    container_name: velonote_frontend
    depends_on:
      - api
    ports:
      - "${PUBLIC_PORT:-3000}:80"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - velonote-net

  # ===========================================================================
  # Ollama Local Model Service (Builtin Mode)
  # Activated only when COMPOSE_PROFILES=builtin or --profile builtin is used.
  # If running in standalone mode (external Ollama), this service is not started.
  # ===========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: velonote_ollama
    profiles:
      - builtin
      - ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    restart: unless-stopped
    networks:
      - velonote-net

  ollama-init:
    image: curlimages/curl:latest
    container_name: velonote_ollama_init
    profiles:
      - builtin
      - ollama
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "/scripts/init_ollama.sh"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b}
    volumes:
      - ./scripts/init_ollama.sh:/scripts/init_ollama.sh:ro
    networks:
      - velonote-net
    restart: "no"

volumes:
  pgdata:
  ollama_models:

networks:
  velonote-net:
    driver: bridge
