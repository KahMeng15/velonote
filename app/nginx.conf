worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Send access logs to shared volume
    access_log /app/logs/1-Frontend.log combined;
    error_log /app/logs/nginx-error.log warn;

    # IMPORTANT: sendfile can cause corruption on ZFS/Docker mounts
    sendfile        off;
    keepalive_timeout  65;

    client_max_body_size 50M;

    server {
        listen       80;
        server_name  localhost;

        root /app/static;

        # API routes — strip /api prefix and proxy to backend
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket connections — proxy to backend directly
        location /ws/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Serve static assets directly with long cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|eot|ttf|otf)$ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }

        # Frontend SPA — serve index.html for all unmatched routes
        location / {
            try_files $uri $uri.html /index.html;
        }
    }
}
