name: CI Checks

on:
  pull_request:
  push:
    branches: ["main", "dev"]
  schedule:
    # Weekly Monday 03:00 UTC — catches newly-disclosed CVEs
    - cron: "0 3 * * 1"

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# BACKEND JOBS
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  python-lint:
    name: Python — Lint & Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint (ruff check)
        run: ruff check app/

      - name: Format check (ruff format)
        run: ruff format --check app/

  python-security:
    name: Python — Dependency & SAST Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install audit tools
        run: pip install pip-audit bandit[toml]

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit --requirement requirements.txt --progress-spinner off

      - name: Static security scan — SAST (bandit)
        run: bandit -r app/ -ll -x app/tests

  secret-scan:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Scan full history, not just HEAD
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  filesystem-scan:
    name: Filesystem Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload filesystem scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ─────────────────────────────────────────────────────────────────────────────
  # FRONTEND JOBS
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  frontend-build:
    name: Frontend — Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create stub frontend env (build only)
        run: echo "VITE_API_URL=http://localhost:8000" > .env

      - name: Build (validates no type/import errors)
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # REQUIRED GATE — all checks must pass before merging
  # ─────────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate (all checks passed)
    runs-on: ubuntu-latest
    needs:
      - python-lint
      - python-security
      - secret-scan
      - filesystem-scan
      - frontend-lint
      - frontend-build
    if: always()
    steps:
      - name: Evaluate results
        run: |
          results='${{ toJSON(needs) }}'
          echo "Job results: $results"
          failed=$(echo "$results" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          failed = [k for k, v in needs.items() if v['result'] not in ('success', 'skipped')]
          if failed:
              print('FAILED:', ', '.join(failed))
              sys.exit(1)
          print('All checks passed.')
          ")
