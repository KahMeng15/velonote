services:
  db:
    image: postgres:15-alpine
    container_name: velonote_db_dev
    environment:
      POSTGRES_USER: ${DB_USER:-velonote}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-velonote}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - velonote-net-dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-velonote}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: velonote:dev
    pull_policy: build
    container_name: velonote_api_dev
    command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port ${API_PORT:-8000} --reload --reload-dir app
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
      - secrets.env
    environment:
      - DB_HOST=db
      - CORS_ALLOWED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000,http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - .:/app  # Mount entire workspace for live-reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - velonote-net-dev

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: velonote:dev
    pull_policy: build
    container_name: velonote_worker_dev
    command: python -m watchfiles 'python -m app.worker_main' app/
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
      - secrets.env
    environment:
      - DB_HOST=db
    volumes:
      - .:/app  # Mount entire workspace for live-reload
      - ./backups/postgres:/app/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - velonote-net-dev

  frontend:
    image: node:20-alpine
    container_name: velonote_frontend_dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=http://api:${API_PORT:-8000}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - velonote-net-dev

  # ===========================================================================
  # Ollama Local Model Service (Builtin Mode)
  # Activated only when COMPOSE_PROFILES=builtin or --profile builtin is used.
  # If running in standalone mode (external Ollama), this service is not started.
  # ===========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: velonote_ollama_dev
    profiles:
      - builtin
      - ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    restart: unless-stopped
    networks:
      - velonote-net-dev

  ollama-init:
    image: curlimages/curl:latest
    container_name: velonote_ollama_init_dev
    profiles:
      - builtin
      - ollama
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "/scripts/init_ollama.sh"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b}
    volumes:
      - ./scripts/init_ollama.sh:/scripts/init_ollama.sh:ro
    networks:
      - velonote-net-dev
    restart: "no"

volumes:
  pgdata:
  ollama_models:
  frontend_node_modules:

networks:
  velonote-net-dev:
    driver: bridge
