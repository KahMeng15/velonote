# Ruff configuration — https://docs.astral.sh/ruff/
target-version = "py311"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear (likely bugs)
    "S",   # flake8-bandit (security — basic)
    "UP",  # pyupgrade (modern Python syntax)
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long — handled by formatter
    "S101",  # assert statements (used in tests)
    "S105",  # hardcoded passwords (false positives on variable names)
    "S106",
    "S108",  # probable insecure temp file
    "S603",  # subprocess without shell=True
    "S607",  # partial executable path
    "B008",  # function calls in default args (FastAPI Depends pattern)
    "RUF012", # mutable class attributes — false positives on SQLAlchemy

    # ── Pre-existing violations (TODO: fix incrementally) ──────────────────
    "E402",  # module-import-not-at-top — FastAPI conditional imports
    "E701",  # multiple statements on one line
    "E702",  # statement ends with semicolon
    "E722",  # bare except — TODO: use specific exception types
    "E741",  # ambiguous variable name (l, O, I)
    "B007",  # unused loop control variable
    "B023",  # function-uses-loop-variable — TODO: use default arg capture
    "B904",  # raise without `from` inside except — TODO: chain exceptions
    "S110",  # try-except-pass — TODO: log or handle explicitly
    "S104",  # hardcoded bind-all-interfaces (0.0.0.0) — intentional for Docker
    "RUF001", # ambiguous unicode character (non-ASCII in strings)
    "RUF003", # ambiguous unicode character in comments
    "RUF005", # collection literal concatenation
    "S608",  # SQL injection — one validated dynamic table lookup in admin.py (table_name checked against metadata)
    "F821",  # undefined name — pre-existing missing imports in several routers (valid at runtime)
]

[lint.per-file-ignores]
# Less strict on scripts
"scripts/*" = ["S", "B"]

[format]
quote-style = "double"
indent-style = "space"
